name: Daily DevLog

on:
  schedule:
    - cron: '3 16 * * *'  # UTC 16:03 = Beijing 00:03
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  generate-devlog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate devlog
        run: |
          YESTERDAY=$(date -d "yesterday" +%Y-%m-%d)
          LOGFILE="docs/devlogs/${YESTERDAY}.md"
          mkdir -p docs/devlogs

          # Get yesterday's commits
          COMMITS=$(git log --oneline --since="${YESTERDAY}T00:00:00+08:00" --until="$(date +%Y-%m-%d)T00:00:00+08:00" 2>/dev/null)

          if [ -z "$COMMITS" ]; then
            cat > "$LOGFILE" << EOF
          # VibeX DevLog — ${YESTERDAY}

          ## Summary / 总结

          **EN:** No commits today. Rest day or planning day.

          **ZH:** 今天没有提交。休息日或计划日。
          EOF
          else
            COMMIT_COUNT=$(echo "$COMMITS" | wc -l)
            FIRST_HASH=$(echo "$COMMITS" | tail -1 | cut -d' ' -f1)
            LAST_HASH=$(echo "$COMMITS" | head -1 | cut -d' ' -f1)
            STATS=$(git diff --stat ${FIRST_HASH}^..${LAST_HASH} 2>/dev/null | tail -1)

            cat > "$LOGFILE" << EOF
          # VibeX DevLog — ${YESTERDAY}

          ## Stats / 统计
          - **Commits:** ${COMMIT_COUNT}
          - **Changes:** ${STATS}

          ## Commits / 提交记录

          $(echo "$COMMITS" | while read line; do echo "- \`$line\`"; done)

          ---
          *Auto-generated by GitHub Actions*
          EOF
          fi

      - name: Commit devlog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/devlogs/
          git diff --cached --quiet || git commit -m "docs: auto-generate devlog for $(date -d yesterday +%Y-%m-%d)"
          git push
